<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1-10ルーレット</title><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f4f4f4;margin:0}.box{text-align:center;background:white;padding:30px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.15)}#num{font-size:80px;font-weight:bold;margin:20px;color:#0078d4}button{font-size:20px;padding:12px 24px;border:none;border-radius:10px;background:#0078d4;color:#fff;cursor:pointer}</style></head><body><div class="box"><h1>人生ゲーム用 1-10ルーレット</h1><div id="num">?</div><button onclick="spin()">回す</button></div><script>function spin(){document.getElementById('num').textContent=Math.floor(Math.random()*10)+1;}</script></body></html>
